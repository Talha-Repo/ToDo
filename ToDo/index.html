<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <link rel="stylesheet" href="style.css"> 

</head>
<body>
    <center>
     <div class="container">
        <h2>To Do List</h2>
      <div class="input">
      <input id="task" placeholder="Enter task here">
      <button id="btnAdd">Add</button>
      </div>
      <div class="menu">
        <label for="checkAll">Check All</label>
        <input type="checkbox" id="checkAll" >
        <label id="lblEntries" >ENTRIES</label>
         <label for="btnDelAll">Delete All</label>
        <button id="btnDelAll" >X</button>
      </div>
        
      <div id="entries" class = "entries">
      
        </div>
     </div>
     </center>
     <script src="script.js"></script>
</body>
</html>
